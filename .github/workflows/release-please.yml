name: Release Please

# docs/release.md describes this flow.

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the pushed master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check every release pull request waiting for a tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/release/release_gate.py

  release-please:
    name: release-please
    needs: release-gate
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Require the release App secrets
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_APP_ID RELEASE_APP_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::secret ${name} is missing from environment 'release' (see docs/release.md)"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Mint a token for the release App
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the release pull request, or tag a merged one
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
